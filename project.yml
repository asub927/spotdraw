name: Spotdraw
options:
  bundleIdPrefix: com.spotdraw
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: true

targets:
  SpotdrawCore:
    type: framework
    platform: macOS
    sources:
      - path: Sources/SpotdrawCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spotdraw.core

  Spotdraw:
    type: application
    platform: macOS
    dependencies:
      - target: SpotdrawCore
    sources:
      - path: Sources/Spotdraw
    settings:
      base:
        INFOPLIST_FILE: Sources/Spotdraw/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.spotdraw.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        COMBINE_HIDPI_IMAGES: true
        LSUIElement: true
    info:
      path: Sources/Spotdraw/Resources/Info.plist
      properties:
        CFBundleName: Spotdraw
        CFBundleDisplayName: Spotdraw
        CFBundleIdentifier: com.spotdraw.app
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        CFBundleExecutable: Spotdraw
        LSMinimumSystemVersion: "13.0"
        LSUIElement: true
        NSMainNibFile: ""
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "Copyright © 2026 Spotdraw. MIT License."
